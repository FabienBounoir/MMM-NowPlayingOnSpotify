<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MagicMirror · Spotify</title>
<!--
  Relais OAuth : Spotify n'accepte que des redirections HTTPS, le miroir est en HTTP sur le réseau local.
  Le "state" contient l'adresse du miroir (base64url) : on y renvoie le téléphone avec le code reçu.
-->
<body style="font:18px system-ui;background:#121212;color:#fff;display:grid;place-items:center;min-height:90vh;text-align:center;padding:1em">
<p id="msg">Retour vers le miroir…</p>
<script>
	try {
		const back = new URL(atob(location.search.match(/state=[^.]*\.([^&]*)/)[1].replace(/-/g, "+").replace(/_/g, "/")));
		// Uniquement vers la route du module : pas de redirection ouverte vers n'importe quel site
		if (!/^https?:$/.test(back.protocol) || back.pathname !== "/MMM-NowPlayingOnSpotify/callback") throw new Error();
		location.replace(back.origin + back.pathname + location.search);
	} catch {
		document.getElementById("msg").textContent = "Lien invalide. Rescanne le QR code affiché sur le miroir.";
	}
</script>
